name: phase-9-11-quality
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.32.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:phase-0-3
      - run: pnpm quality:phase-4-6
      - run: pnpm quality:phase-7-8
      - run: pnpm quality:phase-9-11
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm perf:check
      - run: pnpm build:cf
      - run: pnpm deploy:cf:plan
